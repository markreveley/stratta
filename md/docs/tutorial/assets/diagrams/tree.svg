<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="tree-title">
  <title id="tree-title">The supervision tree of the core. At the top Stratta.Supervisor, strategy one for one. Under it six children: Phoenix.PubSub, Stratta.Store, the Registry named ThreadRegistry, the DynamicSupervisor named ThreadSupervisor, a Task.Supervisor, and Stratta.Socket. ThreadSupervisor has one ThreadServer child per open thread, each restarted only after a crash. The Task.Supervisor holds one short-lived task per socket connection and per API call. The Socket process has a linked acceptor. The registry maps thread ids to ThreadServer processes.</title>
  <defs><marker id="tree-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2)"/></marker><marker id="tree-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker><marker id="tree-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--good)"/></marker><marker id="tree-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--bad)"/></marker><marker id="tree-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--warm)"/></marker></defs>
  <rect x="280" y="12" width="200" height="44" rx="5" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="380.0" y="31.0" font-family="var(--font-display)" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="middle">Stratta.Supervisor</text>
  <text x="380.0" y="48.0" font-family="var(--font-display)" font-size="11.5" font-weight="400" fill="var(--ink-2)" text-anchor="middle">strategy :one_for_one</text>
  <line x1="380" y1="56" x2="69" y2="108" stroke="var(--ink-3)" stroke-width="1.5"/>
  <rect x="12" y="108" width="114" height="46" rx="5" fill="var(--paper)" stroke="var(--ink-2)" stroke-width="1.5"/>
  <text x="69.0" y="128.0" font-family="var(--font-display)" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="middle">PubSub</text>
  <text x="69.0" y="145.0" font-family="var(--font-display)" font-size="11.5" font-weight="400" fill="var(--ink-2)" text-anchor="middle">Phoenix.PubSub</text>
  <line x1="380" y1="56" x2="193" y2="108" stroke="var(--ink-3)" stroke-width="1.5"/>
  <rect x="136" y="108" width="114" height="46" rx="5" fill="var(--paper)" stroke="var(--ink-2)" stroke-width="1.5"/>
  <text x="193.0" y="128.0" font-family="var(--font-display)" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="middle">Store</text>
  <text x="193.0" y="145.0" font-family="var(--font-display)" font-size="11.5" font-weight="400" fill="var(--ink-2)" text-anchor="middle">GenServer</text>
  <line x1="380" y1="56" x2="317" y2="108" stroke="var(--ink-3)" stroke-width="1.5"/>
  <rect x="260" y="108" width="114" height="46" rx="5" fill="var(--paper)" stroke="var(--ink-2)" stroke-width="1.5"/>
  <text x="317.0" y="128.0" font-family="var(--font-display)" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="middle">ThreadRegistry</text>
  <text x="317.0" y="145.0" font-family="var(--font-display)" font-size="11.5" font-weight="400" fill="var(--ink-2)" text-anchor="middle">Registry</text>
  <line x1="380" y1="56" x2="441" y2="108" stroke="var(--ink-3)" stroke-width="1.5"/>
  <rect x="384" y="108" width="114" height="46" rx="5" fill="var(--paper)" stroke="var(--ink-2)" stroke-width="1.5"/>
  <text x="441.0" y="128.0" font-family="var(--font-display)" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="middle">ThreadSupervisor</text>
  <text x="441.0" y="145.0" font-family="var(--font-display)" font-size="11.5" font-weight="400" fill="var(--ink-2)" text-anchor="middle">DynamicSupervisor</text>
