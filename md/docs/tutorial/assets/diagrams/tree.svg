  <text x="565.0" y="145.0" font-family="var(--font-display)" font-size="11.5" font-weight="400" fill="var(--ink-2)" text-anchor="middle">Task.Supervisor</text>
  <line x1="380" y1="56" x2="689" y2="108" stroke="var(--ink-3)" stroke-width="1.5"/>
  <rect x="632" y="108" width="114" height="46" rx="5" fill="var(--paper)" stroke="var(--ink-2)" stroke-width="1.5"/>
  <text x="689.0" y="128.0" font-family="var(--font-display)" font-size="10.5" font-weight="600" fill="var(--ink)" text-anchor="middle">Socket</text>
  <text x="689.0" y="145.0" font-family="var(--font-display)" font-size="11.5" font-weight="400" fill="var(--ink-2)" text-anchor="middle">GenServer</text>
  <line x1="441" y1="154" x2="348" y2="214" stroke="var(--ink-3)" stroke-width="1.5"/>
  <rect x="300" y="214" width="96" height="46" rx="5" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="348.0" y="234.0" font-family="var(--font-display)" font-size="11" font-weight="600" fill="var(--ink)" text-anchor="middle">ThreadServer</text>
  <text x="348.0" y="251.0" font-family="var(--font-display)" font-size="11.5" font-weight="400" fill="var(--ink-2)" text-anchor="middle">thread 1</text>
  <line x1="441" y1="154" x2="452" y2="214" stroke="var(--ink-3)" stroke-width="1.5"/>
  <rect x="404" y="214" width="96" height="46" rx="5" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="452.0" y="234.0" font-family="var(--font-display)" font-size="11" font-weight="600" fill="var(--ink)" text-anchor="middle">ThreadServer</text>
  <text x="452.0" y="251.0" font-family="var(--font-display)" font-size="11.5" font-weight="400" fill="var(--ink-2)" text-anchor="middle">thread 2</text>
  <text x="400" y="280" font-family="var(--font-mono)" font-size="11" font-weight="400" fill="var(--ink-2)" text-anchor="middle">restart: :transient</text>
  <line x1="565" y1="154" x2="565" y2="214" stroke="var(--ink-3)" stroke-width="1.5"/>
  <rect x="510" y="214" width="110" height="46" rx="5" fill="var(--paper)" stroke="var(--ink-2)" stroke-width="1.5"/>
  <text x="565.0" y="234.0" font-family="var(--font-display)" font-size="11.5" font-weight="600" fill="var(--ink)" text-anchor="middle">tasks</text>
  <text x="565.0" y="251.0" font-family="var(--font-display)" font-size="11.5" font-weight="400" fill="var(--ink-2)" text-anchor="middle">one per connection</text>
  <line x1="691" y1="154" x2="691" y2="214" stroke="var(--ink-3)" stroke-width="1.5"/>
  <rect x="636" y="214" width="110" height="46" rx="5" fill="var(--paper)" stroke="var(--ink-2)" stroke-width="1.5"/>
  <text x="691.0" y="234.0" font-family="var(--font-display)" font-size="11.5" font-weight="600" fill="var(--ink)" text-anchor="middle">acceptor</text>
  <text x="691.0" y="251.0" font-family="var(--font-display)" font-size="11.5" font-weight="400" fill="var(--ink-2)" text-anchor="middle">linked to Socket</text>
  <line x1="310" y1="154" x2="334" y2="212" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#tree-accent)"/>
  <text x="222" y="196" font-family="var(--font-display)" font-size="11" font-weight="400" fill="var(--accent)" text-anchor="start">finds by thread id</text>
</svg>
