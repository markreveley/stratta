<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 388" role="img" aria-labelledby="lanes-title">
  <title id="lanes-title">The nineteen steps of next.md that build something, arranged in four lanes, with an arrow wherever one step needs another. Record: step 9, decision records, leads to step 10, traces, and to step 20, claims, which leads to step 21, context seeds. Authority: step 12, the hole reproduced by two routes, leads to step 16, the local grant; step 11, policy rules, needs step 9; step 23, narrowing for views, needs steps 14 and 16. Surfaces: step 13, operation specs and the socket protocol, leads to step 14, views cut out of the app, which leads to step 22, the timing view; step 18, choices, also leads to step 22; step 17, the terminal client, and step 19, the thread tree, need nothing. Places: step 8, the hook spike, leads to step 15, pane requests; steps 24, 1 and 25 stand alone.</title>
