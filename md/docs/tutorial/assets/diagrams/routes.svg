<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 236" role="img" aria-labelledby="routes-title">
  <title id="routes-title">Two ways to bring Jido into Stratta, which differ in who owns the Harness session. Route A, policy only: ThreadServer still owns the session, and a Jido agent beside it holds the rules; ThreadServer hands it a request and gets an answer back. Route B, the plugin owns the thread: a Jido AgentServer with the Harness plugin owns the session, and ThreadServer becomes a client that sends it signals.</title>
  <defs><marker id="routes-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2)"/></marker><marker id="routes-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker><marker id="routes-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--good)"/></marker><marker id="routes-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--bad)"/></marker><marker id="routes-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--warm)"/></marker></defs>
  <rect x="12" y="12" width="358" height="212" rx="5" fill="var(--paper-2)" stroke="var(--rule)" stroke-width="1.5"/>
  <text x="28" y="36" font-family="var(--font-display)" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="start">Route A: policy only</text>
  <rect x="28" y="56" width="150" height="52" rx="5" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="103.0" y="79.0" font-family="var(--font-display)" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="middle">ThreadServer</text>
  <text x="103.0" y="96.0" font-family="var(--font-display)" font-size="11.5" font-weight="400" fill="var(--ink-2)" text-anchor="middle">owns the session</text>
  <rect x="28" y="160" width="150" height="46" rx="5" fill="var(--paper)" stroke="var(--ink-2)" stroke-width="1.5"/>
  <text x="103.0" y="187.5" font-family="var(--font-display)" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="middle">Harness session</text>
  <line x1="103" y1="108" x2="103" y2="160" stroke="var(--ink-2)" stroke-width="1.5" marker-end="url(#routes-ink)"/>
  <rect x="214" y="56" width="140" height="52" rx="5" fill="var(--paper)" stroke="var(--ink-2)" stroke-width="1.5"/>
  <text x="284.0" y="79.0" font-family="var(--font-display)" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="middle">Jido agent</text>
  <text x="284.0" y="96.0" font-family="var(--font-display)" font-size="11.5" font-weight="400" fill="var(--ink-2)" text-anchor="middle">rules as actions</text>
  <line x1="178" y1="72" x2="214" y2="72" stroke="var(--ink-2)" stroke-width="1.5" marker-end="url(#routes-ink)"/>
  <line x1="214" y1="94" x2="178" y2="94" stroke="var(--ink-2)" stroke-width="1.5" marker-end="url(#routes-ink)"/>
  <text x="196" y="132" font-family="var(--font-display)" font-size="11" font-weight="400" fill="var(--ink-2)" text-anchor="middle">a request goes over,</text>
  <text x="196" y="147" font-family="var(--font-display)" font-size="11" font-weight="400" fill="var(--ink-2)" text-anchor="middle">an answer comes back</text>
  <rect x="390" y="12" width="358" height="212" rx="5" fill="var(--paper-2)" stroke="var(--rule)" stroke-width="1.5"/>
  <text x="406" y="36" font-family="var(--font-display)" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="start">Route B: the plugin owns the thread</text>
  <rect x="406" y="56" width="140" height="52" rx="5" fill="var(--paper)" stroke="var(--ink-2)" stroke-width="1.5"/>
  <text x="476.0" y="79.0" font-family="var(--font-display)" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="middle">ThreadServer</text>
  <text x="476.0" y="96.0" font-family="var(--font-display)" font-size="11.5" font-weight="400" fill="var(--ink-2)" text-anchor="middle">a client of the agent</text>
  <rect x="582" y="56" width="150" height="52" rx="5" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="657.0" y="79.0" font-family="var(--font-display)" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="middle">Jido AgentServer</text>
  <text x="657.0" y="96.0" font-family="var(--font-display)" font-size="11.5" font-weight="400" fill="var(--ink-2)" text-anchor="middle">with the Harness plugin</text>
  <rect x="582" y="160" width="150" height="46" rx="5" fill="var(--paper)" stroke="var(--ink-2)" stroke-width="1.5"/>
  <text x="657.0" y="187.5" font-family="var(--font-display)" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="middle">Harness session</text>
  <line x1="657" y1="108" x2="657" y2="160" stroke="var(--ink-2)" stroke-width="1.5" marker-end="url(#routes-ink)"/>
  <line x1="546" y1="82" x2="582" y2="82" stroke="var(--ink-2)" stroke-width="1.5" marker-end="url(#routes-ink)"/>
  <text x="476" y="132" font-family="var(--font-display)" font-size="11" font-weight="400" fill="var(--ink-2)" text-anchor="middle">ThreadServer sends signals</text>
  <text x="476" y="147" font-family="var(--font-display)" font-size="11" font-weight="400" fill="var(--ink-2)" text-anchor="middle">and holds no session</text>
</svg>
