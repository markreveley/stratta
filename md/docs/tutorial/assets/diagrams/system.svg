  <line x1="275" y1="222" x2="275" y2="208" stroke="var(--ink-2)" stroke-width="1.5" marker-end="url(#system-ink)"/>
  <rect x="20" y="96" width="110" height="40" rx="5" fill="var(--paper)" stroke="var(--ink-2)" stroke-width="1.5"/>
  <text x="75.0" y="120.5" font-family="var(--font-display)" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="middle">browser</text>
  <rect x="20" y="176" width="110" height="52" rx="5" fill="var(--warm-soft)" stroke="var(--warm)" stroke-width="1.5"/>
  <text x="75.0" y="199.0" font-family="var(--font-display)" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="middle">LiveView</text>
  <text x="75.0" y="216.0" font-family="var(--font-display)" font-size="11.5" font-weight="400" fill="var(--ink-2)" text-anchor="middle">gui/, same node</text>
  <line x1="75" y1="136" x2="75" y2="176" stroke="var(--ink-2)" stroke-width="1.5" marker-end="url(#system-ink)" marker-start="url(#system-ink)"/>
  <line x1="130" y1="202" x2="168" y2="202" stroke="var(--ink-2)" stroke-width="1.5" marker-end="url(#system-ink)" marker-start="url(#system-ink)"/>
  <text x="149" y="194" font-family="var(--font-display)" font-size="10.5" font-weight="400" fill="var(--ink-2)" text-anchor="middle">calls</text>
