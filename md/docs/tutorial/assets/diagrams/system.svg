  <text x="648" y="116" font-family="var(--font-display)" font-size="12.5" font-weight="600" fill="var(--ink)" text-anchor="middle">tui/</text>
  <text x="648" y="138" font-family="var(--font-mono)" font-size="10.5" font-weight="400" fill="var(--ink)" text-anchor="middle">stratta watch</text>
  <text x="648" y="158" font-family="var(--font-mono)" font-size="10.5" font-weight="400" fill="var(--ink)" text-anchor="middle">stratta attach</text>
  <text x="648" y="178" font-family="var(--font-mono)" font-size="10.5" font-weight="400" fill="var(--ink)" text-anchor="middle">stratta approve 2a</text>
  <text x="648" y="198" font-family="var(--font-mono)" font-size="10.5" font-weight="400" fill="var(--ink)" text-anchor="middle">stratta ship</text>
  <line x1="590" y1="214" x2="532" y2="231" stroke="var(--ink-2)" stroke-width="1.5" marker-end="url(#system-ink)" marker-start="url(#system-ink)"/>
  <text x="568" y="248" font-family="var(--font-display)" font-size="10.5" font-weight="400" fill="var(--ink-2)" text-anchor="middle">Unix socket</text>
  <rect x="190" y="340" width="170" height="46" rx="5" fill="var(--warm-soft)" stroke="var(--warm)" stroke-width="1.5"/>
  <text x="275.0" y="360.0" font-family="var(--font-display)" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="middle">agent program</text>
  <text x="275.0" y="377.0" font-family="var(--font-display)" font-size="11.5" font-weight="400" fill="var(--ink-2)" text-anchor="middle">any agent CLI, or the demo</text>
  <line x1="275" y1="274" x2="275" y2="340" stroke="var(--ink-2)" stroke-width="1.5" marker-end="url(#system-ink)" marker-start="url(#system-ink)"/>
  <text x="285" y="334" font-family="var(--font-display)" font-size="10.5" font-weight="400" fill="var(--ink-2)" text-anchor="start">stdin and stdout</text>
