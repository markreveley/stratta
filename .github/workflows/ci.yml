name: CI

on:
  push:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: ${{ matrix.app }}, Elixir ${{ matrix.elixir }}, OTP ${{ matrix.otp }}${{ matrix.advisory && ' (advisory)' || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: ${{ matrix.advisory }}
    strategy:
      fail-fast: false
      matrix:
        app: [core, gui, tui]
        elixir: ["1.19", "1.20"]
        include:
          - elixir: "1.19"
            otp: "28"
            advisory: false
          - elixir: "1.20"
            otp: "28"
            advisory: true
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Fetch dependencies
        id: deps
        run: mix deps.get

      - name: Dependencies as resolved
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: mix deps

      - name: Compile, warnings are errors
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: mix compile --warnings-as-errors

      - name: Compile for test, warnings are errors
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: MIX_ENV=test mix compile --warnings-as-errors

      - name: Format check
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: mix format --check-formatted

      - name: Tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: mix test
